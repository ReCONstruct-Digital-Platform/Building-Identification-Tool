<div class="my-modal hidden fixed w-full h-full top-[56px] left-0 z-[1055]" id="{{ id }}_modal" tabindex="-1" data-modal-id-prefix="{{ id }}">
  <div class="block relative m-auto w-[50%] overflow-y-scroll max-h-[calc(100vh-56px-56px)] overflow-hidden bg-white rounded-lg p-5 shadow-lg z-[1056]">
      <div class="flex flex-col gap-3">
        <div class="flex">
          <div class="text-xl">
          {{ title }}
        </div>
        <button id="{{ id }}_close_top" type="button"
          class="close-modal-button ms-auto p-2 border border-gray-200 bg-white text-gray-400 hover:text-gray-900 rounded-lg hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
          aria-label="Close">
          <span class="sr-only">Close</span>
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"></path>
          </svg>
        </button>
      </div>
      <div class="flex h-full gap-3">
        {{ children }}
      </div>
      <div class="flex">
        <button id="{{ id }}_close_bottom" type="button"
          class="ms-auto p-2 border border-gray-200 bg-white text-gray-400 hover:text-gray-900 rounded-lg hover:bg-gray-100 inline-flex items-center justify-center">Close</button>
      </div>
    </div>
  </div>
</div>
