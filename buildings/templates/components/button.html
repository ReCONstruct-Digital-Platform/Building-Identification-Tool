<button id="{{ id }}" type="button"
  {% if name %} name="{{ name }}"{% endif %}
 class="{% if type == 'primary' %} bg-teal-600 hover:bg-teal-500 focus-visible:outline-teal-600 {% elif type == 'error' %} bg-red-600 hover:bg-red-500 focus-visible:outline-red-600 {% else %} bg-blue-600 hover:bg-blue-700 focus-visible:outline-blue-700 {% endif %} 
 block justify-center rounded-md px-3 py-1.5 text-sm font-semibold leading-6 text-white shadow-sm focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2" {% if hidden %} style="visibility: hidden;" {% endif %}
>
{{ children }}
</button>
