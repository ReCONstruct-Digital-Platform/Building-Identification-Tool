<div class="modal fade" id="{{ field_name }}_info" tabindex="-1"
  aria-labelledby="{{ field_name }}_label" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="{{ field_name }}_label">
          {{ modal.title }}
        </h1>
        <button id="{{ field_name }}_info_close" type="button" data-bs-dismiss="modal"
          class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8"
          aria-label="Close">
          <span class="sr-only">Close</span>
          <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        {{ modal.body|safe }}
      </div>
      <div class="modal-footer">
        <button type="button"
          class="btn btn-secondary rounded-lg p-1.5 inline-flex items-center justify-center bg-white text-gray-500 hover:text-gray-900 hover:bg-gray-100"
          data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
