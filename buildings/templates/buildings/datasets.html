{% extends "buildings/base.html" %}
{% load static %}
{% load i18n %}
{% load allauth %}


{% block content %}

<!-- <div class="w-full h-full flex flex-col justify-center items-center place-content-evenly"> -->
<div class="relative isolate px-6 lg:px-8 flex-col h-[100vh] items-center justify-center">

  <div class="home-content mx-auto max-w-6xl py-32 sm:py-48 lg:py-32">

    <section class="flex flex-col justify-start">

      <h1 class="w-full mb-2 text-2xl font-bold tracking-tight text-gray-900">My Datasets</h1>
      <hr>

      <div class="flex flex-row">

        {% for dataset in datasets %}
        <a href="#"
          class="flex flex-col max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700 m-4">
          <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white"> {{ dataset.name }}</h5>
          <p class="font-normal text-gray-700 dark:text-gray-400">description</p>
        </a>
        {% endfor %}
      </div>

    </section>
  </div>


  {% endblock %}
