{% with id=widget.attrs.id initial_val=widget.value.0 %}
<div id="{{ id }}" class="{{ widget.attrs.class }}">
  {% for _, options, _ in widget.optgroups %}
    {% for option in options %}
      <label class="flex items-center my-0.5">
        <input id="{{ option.attrs.id }}" class="{{ widget.attrs.radio_class }}" type="{{ option.type }}" 
          name="{{ option.name }}" value="{{ option.value }}" 
          {% if initial_val == option.value %} checked{% elif initial_val is None and option.value == ''%} checked{% endif %} required>{{ option.label }}</label>
    {% endfor %}
  {% endfor %}
</div>
{% endwith %}
