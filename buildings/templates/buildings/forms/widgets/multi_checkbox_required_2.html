{% with id=widget.attrs.id %}
<div id="{{ id }}" class="{{ widget.attrs.class }}" >
  {% for _, options, _ in widget.optgroups %}
    {% for option in options %}
    {% if widget.has_specify and option.value == widget.specify_option_value %}
    <div id="{{ id }}_specify_container" class="flex items-center my-0.5">
      <label class="flex items-center" onclick="markCheckboxesNotRequired('{{ widget.name }}'); activateSpecifyEntryField('{{ id }}_specify');" >
        <input id = "{{ id }}_specify" type="{{ widget.input_type }}" class = "{{ widget.attrs.checkbox_class }}" name="{{ widget.name }}" 
        {% if 'on' in widget.initial %} checked{% endif %} 
        {% if widget.initial|length == 0 %}required{%endif%}>{{ option.label }}</label>
      <input class="{{ widget.attrs.specify_class }}" id="{{ id }}_specify_value" type="{{ widget.specify_input_type }}" name="{{ widget.name }}" 
        {% if 'on' in widget.initial %} value="{{ widget.initial|last }}" {% else %} disabled{% endif %}/>
    </div>
    {% else %}
    <label class="flex items-center my-0.5">
      <input id="{{ option.attrs.id }}" class="{{ widget.attrs.checkbox_class }}" type="{{ widget.input_type }}" name="{{ option.name }}" 
      onclick='markCheckboxesNotRequired("{{ option.name }}")' value="{{ option.value|stringformat:'s' }}" 
      {% if option.value in widget.initial %} checked{% endif %}
      {% if widget.initial|length == 0 %} required{% endif %}>{{ option.label }}
    </label>
    {% endif %}
    {% endfor %}
  {% endfor %}

</div>
{% endwith %}
