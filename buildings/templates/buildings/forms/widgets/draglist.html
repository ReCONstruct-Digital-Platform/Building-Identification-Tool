<ul class="draggable-list space-y-2">
  {% for val in widget.value %}
  <li class="flex items-center bg-white p-2 rounded-lg shadow-sm cursor-grab w-fit"
    draggable="true">
    <div class="mr-3 text-gray-400 cursor-grab">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        class="lucide lucide-grip-vertical">
        <circle cx="9" cy="12" r="1" /><circle cx="9" cy="5" r="1" /><circle cx="9" cy="19" r="1" /><circle cx="15" cy="12" r="1" /><circle cx="15" cy="5" r="1" /><circle cx="15" cy="19" r="1" />
      </svg>
    </div>
    <label class="">
      <input type="text" name="options" value="{{ val }}" placeholder="{{ val }}"
        class="{{widget.attrs.class}}">
    </label>
  </li>
  {% endfor %}
</ul>
