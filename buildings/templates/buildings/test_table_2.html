<script src="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css"></script> <!-- For Icons -->
<script>
  // Sorting function with icons
  let currentSortColumn = null;
  let currentSortDirection = "asc";

  function sortTable(n, tableId) {
    const table = document.getElementById(tableId);
    const rows = Array.from(table.rows);
    const header = rows.shift(); // Remove the header row for sorting
    const dir = currentSortColumn === n && currentSortDirection === "asc" ? "desc" : "asc";
    const sortedRows = rows.sort((a, b) => {
      const x = a.getElementsByTagName("TD")[n].innerText;
      const y = b.getElementsByTagName("TD")[n].innerText;
      return (dir === "asc" ? x > y : x < y) ? 1 : -1;
    });

    table.innerHTML = ""; // Clear the table body
    table.appendChild(header); // Append the header row
    sortedRows.forEach(row => table.appendChild(row)); // Reattach sorted rows

    // Toggle the sort direction and icon
    currentSortColumn = n;
    currentSortDirection = dir;
    updateSortIcons(n, dir);
  }

  function updateSortIcons(columnIndex, direction) {
    const headers = document.querySelectorAll('th');
    headers.forEach((header, index) => {
      const icon = header.querySelector('i');
      if (index === columnIndex) {
        icon.classList.toggle('mdi-arrow-up', direction === "asc");
        icon.classList.toggle('mdi-arrow-down', direction === "desc");
      } else {
        icon.classList.remove('mdi-arrow-up', 'mdi-arrow-down');
      }
    });
  }
</script>
{% endblock %}

<!-- Column Visibility Controls -->
<div class="mt-4">
  <label class="inline-flex items-center">
      <input type="checkbox" checked class="column-toggle" data-column="0" />
      <span class="ml-2">Title</span>
  </label>
</div>

<script>
// Column toggle functionality
document.querySelectorAll('.column-toggle').forEach(function(checkbox) {
  checkbox.addEventListener('change', function() {
      const column = this.dataset.column;
      const cells = document.querySelectorAll(`table tr > *:nth-child(${+column + 1})`);
      cells.forEach(cell => cell.classList.toggle('hidden', !this.checked));
  });
});

// Sorting functionality
function sortTable(columnIndex) {
  const table = document.getElementById('data-table');
  const rows = Array.from(table.querySelectorAll('tr'));
  const sortedRows = rows.sort((a, b) => {
      const aText = a.querySelector(`td:nth-child(${columnIndex + 1})`).textContent.trim();
      const bText = b.querySelector(`td:nth-child(${columnIndex + 1})`).textContent.trim();
      return aText.localeCompare(bText);
  });
  sortedRows.forEach(row => table.appendChild(row));
}

// Column drag-and-drop functionality
const header = document.getElementById('table-header');
let draggedColumnIndex = null;

header.addEventListener('dragstart', (e) => {
  draggedColumnIndex = Array.from(header.children[0].children).indexOf(e.target);
  e.dataTransfer.effectAllowed = 'move';
});

header.addEventListener('dragover', (e) => {
  e.preventDefault();
});

header.addEventListener('drop', (e) => {
  e.preventDefault();
  const targetColumn = e.target;
  if (targetColumn.tagName !== 'TH') return;

  const targetIndex = Array.from(header.children[0].children).indexOf(targetColumn);
  const rows = document.querySelectorAll('table tr');

  rows.forEach(row => {
      const cells = Array.from(row.children);
      if (draggedColumnIndex !== null) {
          row.insertBefore(cells[draggedColumnIndex], cells[targetIndex]);
      }
  });

  draggedColumnIndex = null;
});
</script>
